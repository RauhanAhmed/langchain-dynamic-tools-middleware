[project]
name = "langchain-dynamic-tools-middleware"
version = "0.2.0"
description = "LangChain agent middleware that selects the most relevant tools per step with local hybrid dense and sparse vector search over zvec"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rauhan Ahmed Siddiqui", email = "rauhaan.siddiqui@gmail.com" },
]
keywords = [
    "langchain",
    "agents",
    "middleware",
    "tool-selection",
    "dynamic-tools",
    "function-calling",
    "zvec",
    "vector-search",
    "hybrid-search",
    "sparse-embeddings",
    "rag",
    "agent-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "zvec>=0.5",
    "langchain>=1.0",
]

[project.urls]
Homepage = "https://github.com/RauhanAhmed/langchain-dynamic-tools-middleware"
Repository = "https://github.com/RauhanAhmed/langchain-dynamic-tools-middleware"
Issues = "https://github.com/RauhanAhmed/langchain-dynamic-tools-middleware/issues"
Changelog = "https://github.com/RauhanAhmed/langchain-dynamic-tools-middleware/blob/main/CHANGELOG.md"

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
bench = [
    "matplotlib>=3.8",
    "tiktoken>=0.7",
    "langchain-openai>=0.2",
    "langchain-openrouter>=0.1",
    "langchain-nvidia-ai-endpoints>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Direct dependency so the CPU index pin below applies (tool.uv.sources
    # does not reach transitive requirements like the one sentence-transformers pulls).
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_dynamic_tools"]

[tool.uv]
# The dev dependency group is installed by default with uv sync and uv run.
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Linux pulls CUDA-enabled torch from PyPI by default, which is over 2 GB.
# The embedding models here run on CPU, so point uv at the CPU wheel index
# for every platform. Published metadata is unaffected: pip users resolve
# torch normally.
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["langchain_dynamic_tools"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/langchain_dynamic_tools"]

[[tool.mypy.overrides]]
module = ["zvec", "zvec.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not local' --cov=langchain_dynamic_tools --cov-report=term-missing"
markers = [
    "local: tests that download and run real embedding models (deselect with -m 'not local')",
]

[tool.coverage.run]
source = ["src/langchain_dynamic_tools"]
