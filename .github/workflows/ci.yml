name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Lint, type check, and packaging run once on Python 3.11: mypy targets
    # 3.10 syntax, and newer locked numpy stubs use 3.12-only syntax that the
    # 3.10 grammar cannot parse on 3.12+ runners. Runtime coverage across
    # versions lives in the test matrix below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Build check
        run: uv build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test
        run: uv run pytest
